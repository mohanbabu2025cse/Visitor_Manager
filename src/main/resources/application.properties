spring.profiles.default=mysql
spring.application.name=visitor-management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
# Real SMS is opt-in. Credentials belong in environment variables, never in source code.
app.sms.enabled=${SMS_ENABLED:false}
app.sms.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.from-number=${TWILIO_FROM_NUMBER:}
